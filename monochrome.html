
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Monochrome — a fine art photography collection by Atilla Yurttaş.">
  <title>Monochrome | Atilla Yurttaş Photography</title>

  <style>
    :root {
      --bg: #111110;
      --text: #f5f2eb;
      --muted: #a9a7a2;
      --accent: #c4a77d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      max-width: 1600px;
      margin: auto;
      padding: 30px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .back {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .intro {
      text-align: center;
      padding: 85px 20px 110px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(58px, 10vw, 130px);
      font-weight: normal;
      font-style: italic;
      letter-spacing: -4px;
      margin: 22px 0;
    }

    .intro p {
      color: var(--muted);
      font-family: Georgia, serif;
      font-size: 17px;
      font-style: italic;
    }

    .gallery {
      max-width: 1450px;
      margin: auto;
      padding: 0 6%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 55px;
      row-gap: 100px;
      align-items: start;
    }

    figure {
      margin: 0;
      min-width: 0;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
      transition: opacity .3s ease;
    }

    figure img:hover {
      opacity: .88;
    }

    figure.featured {
      grid-column: 1 / -1;
      width: min(100%, 1050px);
      justify-self: center;
    }

    figure.featured img {
      max-height: 85vh;
      object-fit: contain;
    }

    figure.offset {
      margin-top: 110px;
    }

    figcaption {
      margin-top: 18px;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 15px;
      color: var(--muted);
    }

    .number {
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-style: normal;
      letter-spacing: 2px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 50px;
      background: rgba(0, 0, 0, .97);
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    footer {
      padding: 130px 20px 45px;
      text-align: center;
      color: #77736e;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @media (max-width: 700px) {
      header {
        padding: 23px 5%;
      }

      .brand {
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .back {
        font-size: 10px;
      }

      .intro {
        padding: 65px 15px 75px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .intro p {
        font-size: 14px;
      }

      .gallery {
        grid-template-columns: 1fr;
        padding: 0 5%;
        row-gap: 65px;
      }

      figure.featured {
        grid-column: auto;
        width: 100%;
      }

      figure.offset {
        margin-top: 0;
      }

      figcaption {
        font-size: 14px;
      }

      .lightbox {
        padding: 15px;
      }

      footer {
        padding-top: 90px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="brand" href="index.html">Atilla Yurttaş</a>
    <a class="back" href="index.html">← Back to Home</a>
  </header>

  <section class="intro">
    <div class="eyebrow">Photography / Collection 01</div>
    <h1>Monochrome.</h1>
    <p>A study of light, shadow, and the human presence.</p>
  </section>

  <main class="gallery" id="gallery"></main>

  <div class="lightbox" id="lightbox" role="dialog"
       aria-label="Enlarged photograph">
    <img id="lightbox-image" alt="">
  </div>

  <footer>
    © 2026 ATILLA YURTTAŞ · ALL RIGHTS RESERVED
  </footer>

  <script>
    const folder = "images/monochrome/";

    const collection = [
      { file: "where-shadows-gather.jpg", featured: true },
      { file: "a-moment-between-breaths.jpg" },
      { file: "among-the-echoes.jpeg", offset: true },
      { file: "passing-through-time.jpg" },
      { file: "crossing-the-light.jpg", featured: true },
      { file: "between-faith-and-silence.jpg" },
      { file: "at-the-threshold.jpg", offset: true },
      { file: "in-quiet-devotion.JPG" },
      { file: "into-the-depths.jpg", featured: true },
      { file: "before-the-ascent.JPG" },
      { file: "between-earth-and-sky.JPG", offset: true },
      { file: "the-space-between.JPG" },
      { file: "passing-through-light.jpg", featured: true },
      { file: "a-moment-of-stillness.jpg" },
      { file: "the-quiet-center.JPG", offset: true },
      { file: "under-the-rain.jpg" },
      { file: "the-weight-of-stillness.JPG" },
    ];

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");

    function titleFromFilename(filename) {
      return filename
        .replace(/\.(jpg|jpeg|png|webp)$/i, "")
        .replace(/-/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    collection.forEach((photo, index) => {
      const figure = document.createElement("figure");
      const img = document.createElement("img");
      const caption = document.createElement("figcaption");
      const number = document.createElement("span");

      if (photo.featured) {
        figure.classList.add("featured");
      }

      if (photo.offset) {
        figure.classList.add("offset");
      }

      img.src = folder + encodeURIComponent(photo.file);
      img.alt = titleFromFilename(photo.file);
      img.loading = index === 0 ? "eager" : "lazy";

      number.className = "number";
      number.textContent = String(index + 1).padStart(2, "0");

      caption.appendChild(number);
      caption.appendChild(
        document.createTextNode(titleFromFilename(photo.file))
      );

      img.addEventListener("click", () => {
        lightboxImage.src = img.src;
        lightboxImage.alt = img.alt;
        lightbox.classList.add("open");
      });

      figure.append(img, caption);
      gallery.appendChild(figure);
    });

    lightbox.addEventListener("click", () => {
      lightbox.classList.remove("open");
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        lightbox.classList.remove("open");
      }
    });
  </script>

</body>
</html>
