
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Monochrome — a fine art photography exhibition by Atilla Yurttaş. A study of light, humanity and silence.">
  <title>Monochrome — Atilla Yurttaş Photography</title>

  <style>
    :root {
      --bg: #101010;
      --paper: #f0eee8;
      --muted: #aaa69e;
      --gold: #bca27d;
      --line: #34312e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.lightbox-open {
      overflow: hidden;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    /* HEADER */

    .site-header {
      max-width: 1540px;
      margin: 0 auto;
      padding: 30px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-decoration: none;
    }

    .back {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-decoration: none;
    }

    .back:hover {
      color: var(--paper);
    }

    /* INTRO */

    .intro {
      padding: 105px 20px 115px;
      text-align: center;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(62px, 10vw, 132px);
      font-weight: 400;
      font-style: italic;
      line-height: 1.05;
      letter-spacing: -4px;
    }

    .intro-subtitle {
      color: var(--muted);
      font-family: Georgia, serif;
      font-size: 17px;
      font-style: italic;
    }

    .scroll-hint {
      margin-top: 64px;
      color: #77736d;
      font-size: 9px;
      letter-spacing: 3px;
    }

    /* EXHIBITION */

    .exhibition {
      max-width: 1450px;
      margin: 0 auto;
      padding: 0 5%;
    }

    .gallery-section {
      margin-bottom: 115px;
    }

    .gallery-section:last-child {
      margin-bottom: 0;
    }

    .solo {
      display: flex;
      justify-content: center;
    }

    .solo .artwork {
      width: 100%;
      max-width: 1000px;
    }

    .solo.portrait .artwork {
      max-width: 680px;
    }

    .solo.landscape .artwork {
      max-width: 1100px;
    }

    .pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: clamp(28px, 5vw, 85px);
    }

    .artwork {
      min-width: 0;
      margin: 0;
    }

    .artwork-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: zoom-in;
      text-align: left;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      transition: opacity .3s ease;
    }

    .artwork-button:hover .artwork-image {
      opacity: .86;
    }

    .artwork-button:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 8px;
    }

    .artwork-caption {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-top: 19px;
    }

    .art-number {
      flex: 0 0 auto;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 1px;
    }

    .art-title {
      color: var(--muted);
      font-family: Georgia, serif;
      font-size: 16px;
      font-style: italic;
      line-height: 1.4;
    }

    /* CHAPTER DIVIDERS */

    .chapter {
      display: flex;
      align-items: center;
      gap: 25px;
      margin: 140px 0 115px;
    }

    .chapter-line {
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .chapter-label {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* OUTRO */

    .outro {
      max-width: 700px;
      margin: 150px auto 0;
      padding: 0 20px;
      text-align: center;
    }

    .outro-line {
      width: 40px;
      height: 1px;
      margin: 0 auto 35px;
      background: var(--gold);
    }

    .outro p {
      font-family: Georgia, serif;
      font-size: clamp(23px, 4vw, 36px);
      font-style: italic;
      line-height: 1.4;
      color: var(--paper);
    }

    .outro a {
      display: inline-block;
      margin-top: 25px;
      color: var(--gold);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
    }

    footer {
      padding: 110px 20px 40px;
      text-align: center;
      color: #77736d;
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* FULLSCREEN VIEWER */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 80px;
      background: rgba(0, 0, 0, .985);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-image {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 22px;
      color: var(--paper);
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 16px;
      text-align: center;
    }

    .lightbox-counter {
      margin-top: 12px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      border: none;
      background: transparent;
      color: var(--paper);
      cursor: pointer;
      padding: 14px;
      font-family: Arial, sans-serif;
    }

    .lightbox-close {
      top: 15px;
      right: 25px;
      font-size: 34px;
    }

    .lightbox-prev,
    .lightbox-next {
      top: 50%;
      transform: translateY(-50%);
      font-size: 42px;
    }

    .lightbox-prev {
      left: 15px;
    }

    .lightbox-next {
      right: 15px;
    }

    .lightbox button:focus-visible {
      outline: 1px solid var(--gold);
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .site-header {
        padding: 24px 5%;
      }

      .brand {
        font-size: 10px;
        letter-spacing: 1.4px;
      }

      .back {
        font-size: 10px;
        letter-spacing: .5px;
      }

      .intro {
        padding: 75px 16px 80px;
      }

      h1 {
        font-size: clamp(52px, 12vw, 76px);
        letter-spacing: -2px;
      }

      .intro-subtitle {
        font-size: 15px;
      }

      .scroll-hint {
        margin-top: 45px;
      }

      .exhibition {
        padding: 0 5%;
      }

      .gallery-section {
        margin-bottom: 68px;
      }

      .pair {
        grid-template-columns: 1fr;
        gap: 68px;
      }

      .solo.portrait .artwork,
      .solo.landscape .artwork {
        max-width: 100%;
      }

      .artwork-caption {
        margin-top: 14px;
        gap: 13px;
      }

      .art-title {
        font-size: 15px;
      }

      .chapter {
        gap: 14px;
        margin: 85px 0 75px;
      }

      .chapter-label {
        font-size: 9px;
        letter-spacing: 2px;
      }

      .outro {
        margin-top: 100px;
      }

      footer {
        padding-top: 85px;
      }

      .lightbox {
        padding: 55px 14px 90px;
      }

      .lightbox-image {
        max-height: 70vh;
      }

      .lightbox-close {
        top: 8px;
        right: 10px;
      }

      .lightbox-prev,
      .lightbox-next {
        top: auto;
        bottom: 12px;
        transform: none;
        font-size: 36px;
      }

      .lightbox-prev {
        left: 20px;
      }

      .lightbox-next {
        right: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .artwork-image {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="brand">ATILLA YURTTAŞ</a>
    <a href="index.html" class="back">← BACK TO HOME</a>
  </header>

  <section class="intro">
    <div class="eyebrow">Photography / Collection 01</div>
    <h1>Monochrome.</h1>
    <div class="intro-subtitle">Light. Humanity. Silence.</div>
    <div class="scroll-hint">SCROLL TO EXPLORE ↓</div>
  </section>

  <main
    class="exhibition"
    id="exhibition"
    aria-label="Monochrome photography exhibition">
  </main>

  <section class="outro">
    <div class="outro-line"></div>
    <p>Some stories are best told without colour.</p>
    <a href="index.html">RETURN TO HOME →</a>
  </section>

  <footer>
    © 2026 ATILLA YURTTAŞ · ALL RIGHTS RESERVED
  </footer>

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photography slideshow"
    aria-hidden="true">

    <button
      class="lightbox-close"
      id="close"
      aria-label="Close slideshow">×</button>

    <button
      class="lightbox-prev"
      id="prev"
      aria-label="Previous photograph">‹</button>

    <img
      class="lightbox-image"
      id="lightbox-image"
      alt="">

    <div class="lightbox-caption" id="lightbox-caption"></div>
    <div class="lightbox-counter" id="lightbox-counter"></div>

    <button
      class="lightbox-next"
      id="next"
      aria-label="Next photograph">›</button>
  </div>

  <script>
    "use strict";

    const folder = "images/monochrome/";

    /*
      16 unique photographs.
      Filenames match the GitHub folder.
      Extensions are case-sensitive.
    */

    const photos = [
      { file: "where-shadows-gather.jpg" },
      { file: "a-moment-between-breaths.jpg" },
      { file: "passing-through-time.jpg" },
      { file: "crossing-the-light.jpg" },
      { file: "between-faith-and-silence.jpg" },
      { file: "at-the-threshold.jpg" },
      { file: "in-quiet-devotion.JPG" },
      { file: "into-the-depths.jpg" },
      { file: "before-the-ascent.JPG" },
      { file: "between-earth-and-sky.JPG" },
      { file: "the-space-between.JPG" },
      { file: "passing-through-light.jpg" },
      { file: "a-moment-of-stillness.jpg" },
      { file: "the-quiet-center.JPG" },
      { file: "under-the-rain.jpg" },
      { file: "the-weight-of-stillness.JPG" }
    ];

    /*
      Exhibition layout.
      Valid photo indexes: 0 through 15.
    */

    const layout = [
      { type: "solo", shape: "portrait", photos: [0] },
      { type: "pair", photos: [1, 2] },
      { type: "solo", shape: "portrait", photos: [3] },

      { type: "chapter", label: "I · HUMANITY" },

      { type: "pair", photos: [4, 5] },
      { type: "solo", shape: "portrait", photos: [6] },
      { type: "pair", photos: [7, 8] },

      { type: "chapter", label: "II · PASSAGES" },

      { type: "pair", photos: [9, 10] },
      { type: "solo", shape: "portrait", photos: [11] },
      { type: "pair", photos: [12, 13] },

      { type: "chapter", label: "III · STILLNESS" },

      { type: "pair", photos: [14, 15] }
    ];

    const exhibition = document.getElementById("exhibition");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const lightboxCounter = document.getElementById("lightbox-counter");
    const closeButton = document.getElementById("close");

    let currentIndex = 0;
    let previousFocus = null;
    let touchStartX = 0;

    function titleFromFile(file) {
      return file
        .replace(/\.(jpg|jpeg|png|webp)$/i, "")
        .replace(/-/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function photoUrl(photo) {
      return folder + encodeURIComponent(photo.file);
    }

    function createArtwork(index) {
      const photo = photos[index];

      if (!photo) {
        console.warn("Missing photograph at index:", index);
        return document.createDocumentFragment();
      }

      const figure = document.createElement("figure");
      figure.className = "artwork";

      const button = document.createElement("button");
      button.className = "artwork-button";
      button.type = "button";

      button.setAttribute(
        "aria-label",
        "View " + titleFromFile(photo.file) + " fullscreen"
      );

      const image = document.createElement("img");
      image.className = "artwork-image";
      image.src = photoUrl(photo);
      image.alt = titleFromFile(photo.file);
      image.loading = index === 0 ? "eager" : "lazy";
      image.decoding = "async";

      button.appendChild(image);

      button.addEventListener("click", () => {
        openLightbox(index);
      });

      const caption = document.createElement("figcaption");
      caption.className = "artwork-caption";

      const number = document.createElement("span");
      number.className = "art-number";
      number.textContent = String(index + 1).padStart(2, "0");

      const title = document.createElement("span");
      title.className = "art-title";
      title.textContent = titleFromFile(photo.file);

      caption.append(number, title);
      figure.append(button, caption);

      return figure;
    }

    function createChapter(label) {
      const chapter = document.createElement("div");
      chapter.className = "chapter";
      chapter.setAttribute("aria-label", label);

      const left = document.createElement("div");
      left.className = "chapter-line";

      const text = document.createElement("span");
      text.className = "chapter-label";
      text.textContent = label;

      const right = document.createElement("div");
      right.className = "chapter-line";

      chapter.append(left, text, right);

      return chapter;
    }

    function buildExhibition() {
      layout.forEach(item => {
        if (item.type === "chapter") {
          exhibition.appendChild(createChapter(item.label));
          return;
        }

        const section = document.createElement("section");
        section.className = "gallery-section " + item.type;

        if (item.shape) {
          section.classList.add(item.shape);
        }

        item.photos.forEach(index => {
          section.appendChild(createArtwork(index));
        });

        exhibition.appendChild(section);
      });
    }

    function showPhoto(index) {
      currentIndex = (index + photos.length) % photos.length;

      const photo = photos[currentIndex];

      lightboxImage.src = photoUrl(photo);
      lightboxImage.alt = titleFromFile(photo.file);
      lightboxCaption.textContent = titleFromFile(photo.file);

      lightboxCounter.textContent =
        String(currentIndex + 1).padStart(2, "0") +
        " / " +
        String(photos.length).padStart(2, "0");
    }

    function openLightbox(index) {
      previousFocus = document.activeElement;

      showPhoto(index);

      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.classList.add("lightbox-open");

      closeButton.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.classList.remove("lightbox-open");

      if (previousFocus && previousFocus.focus) {
        previousFocus.focus();
      }
    }

    closeButton.addEventListener("click", closeLightbox);

    document.getElementById("prev").addEventListener("click", () => {
      showPhoto(currentIndex - 1);
    });

    document.getElementById("next").addEventListener("click", () => {
      showPhoto(currentIndex + 1);
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) {
        return;
      }

      if (event.key === "Escape") {
        closeLightbox();
      } else if (event.key === "ArrowLeft") {
        showPhoto(currentIndex - 1);
      } else if (event.key === "ArrowRight") {
        showPhoto(currentIndex + 1);
      } else if (event.key === "Tab") {
        const controls = [
          document.getElementById("close"),
          document.getElementById("prev"),
          document.getElementById("next")
        ];

        const first = controls[0];
        const last = controls[controls.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });

    lightbox.addEventListener("touchstart", event => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    lightbox.addEventListener("touchend", event => {
      const difference =
        event.changedTouches[0].screenX - touchStartX;

      if (Math.abs(difference) > 50) {
        showPhoto(currentIndex + (difference < 0 ? 1 : -1));
      }
    }, { passive: true });

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    buildExhibition();
  </script>

</body>
</html>
