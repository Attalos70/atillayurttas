
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monochrome | Atilla Yurttaş Photography</title>
  <meta name="description" content="Monochrome photography by Atilla Yurttaş. Light, shadow, people and places.">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111110;
      color: #f0eee9;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 30px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      color: #eee;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .back {
      color: #bca582;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .intro {
      text-align: center;
      padding: 85px 20px 95px;
    }

    .eyebrow {
      color: #bca582;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(58px, 10vw, 130px);
      font-weight: 400;
      font-style: italic;
      letter-spacing: -4px;
      margin: 20px 0;
    }

    .intro p {
      color: #a9a7a2;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 17px;
    }

    .gallery {
      max-width: 1500px;
      margin: auto;
      padding: 0 6%;
      columns: 2;
      column-gap: 48px;
    }

    figure {
      margin: 0 0 85px;
      break-inside: avoid;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
    }

    figcaption {
      margin-top: 17px;
      font-family: Georgia, serif;
      font-size: 15px;
      font-style: italic;
      color: #a9a7a2;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .96);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 40px;
      cursor: zoom-out;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    footer {
      text-align: center;
      padding: 90px 20px 40px;
      color: #77736e;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @media (max-width: 700px) {
      header { padding: 24px 5%; }
      .brand { font-size: 10px; }
      .intro { padding: 65px 15px; }
      h1 { letter-spacing: -2px; }
      .gallery { columns: 1; padding: 0 5%; }
      figure { margin-bottom: 55px; }
    }
  </style>
</head>

<body>

  <header>
    <a class="brand" href="index.html">Atilla Yurttaş</a>
    <a class="back" href="index.html">← Back to Home</a>
  </header>

  <section class="intro">
    <div class="eyebrow">Photography / Collection 01</div>
    <h1>Monochrome.</h1>
    <p>A study of light, shadow, and the human presence.</p>
  </section>

  <main class="gallery" id="gallery"></main>

  <div class="lightbox" id="lightbox" role="dialog"
       aria-label="Enlarged photograph">
    <img id="lightbox-image" alt="">
  </div>

  <footer>
    © 2026 ATILLA YURTTAŞ · ALL RIGHTS RESERVED
  </footer>

  <script>
    const owner = "Attalos70";
    const repo = "atillayurttas";
    const folder = "images/monochrome";
    const gallery = document.getElementById("gallery");

    function titleFromFilename(filename) {
      return filename
        .replace(/\.(jpg|jpeg|png|webp)$/i, "")
        .replace(/-/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    async function loadGallery() {
      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Could not load photographs.");
        }

        const files = await response.json();

        const photos = files.filter(file =>
          /\.(jpg|jpeg|png|webp)$/i.test(file.name)
        );

        photos.sort((a, b) => a.name.localeCompare(b.name));

        for (const photo of photos) {
          const figure = document.createElement("figure");
          const img = document.createElement("img");
          const caption = document.createElement("figcaption");

          img.src = `${folder}/${encodeURIComponent(photo.name)}`;
          img.alt = titleFromFilename(photo.name);
          img.loading = "lazy";

          caption.textContent = titleFromFilename(photo.name);

          img.addEventListener("click", () => {
            document.getElementById("lightbox-image").src = img.src;
            document.getElementById("lightbox").classList.add("open");
          });

          figure.append(img, caption);
          gallery.appendChild(figure);
        }
      } catch (error) {
        gallery.textContent =
          "The collection could not be loaded. Please try again later.";
      }
    }

    document.getElementById("lightbox")
      .addEventListener("click", event => {
        event.currentTarget.classList.remove("open");
      });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.getElementById("lightbox").classList.remove("open");
      }
    });

    loadGallery();
  </script>

</body>
</html>
